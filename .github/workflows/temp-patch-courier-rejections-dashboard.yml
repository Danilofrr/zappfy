name: Temporary courier rejection dashboard validation

on:
  push:
    branches:
      - feat/recusas-como-nao-entregues
    paths:
      - tools/run-courier-rejections-dashboard-patch.marker

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recusas-como-nao-entregues
          fetch-depth: 0

      - name: Adjust failed-delivery metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260912210000_track_courier_rejections_as_failed.sql')
          text = p.read_text()
          old = "      'can_reassign', CASE WHEN _action = 'fail' THEN true ELSE NULL END,\n"
          if old in text:
              text = text.replace(old, "", 1)
              p.write_text(text)
          PY

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          grep -q 'failedOrders: any\[\]' 'src/routes/_authenticated/motoboys.tsx'
          grep -q 'failed: failedOrders.length' 'src/routes/_authenticated/motoboys.tsx'
          grep -q 'Aguardando nova atribuição' 'src/routes/_authenticated/motoboys.tsx'
          grep -q "'kind', 'assignment_rejected'" 'supabase/migrations/20260912210000_track_courier_rejections_as_failed.sql'
          grep -q "'can_reassign', true" 'supabase/migrations/20260912210000_track_courier_rejections_as_failed.sql'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Commit metadata adjustment
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'supabase/migrations/20260912210000_track_courier_rejections_as_failed.sql'
          git diff --cached --check
          git commit -m "fix: limitar nova atribuicao a recusas de motoboy"
          git push origin HEAD:feat/recusas-como-nao-entregues
