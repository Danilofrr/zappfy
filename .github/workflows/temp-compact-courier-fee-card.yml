name: Temp compact courier fee card patch

on:
  push:
    branches:
      - fix/courier-fee-card-compact

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/courier-fee-card-compact
          fetch-depth: 0

      - name: Remove fee calculation detail line
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_authenticated/motoboys.tsx')
          text = path.read_text()
          old = '''                          <div className="mt-1 text-[10px] leading-tight text-muted-foreground">\n                            {deliveredCount} {deliveredCount === 1 ? "entrega" : "entregas"} × {brl(motoboyFee)}\n                          </div>\n'''
          if old not in text:
              raise SystemExit('Fee detail line not found')
          text = text.replace(old, '', 1)
          path.write_text(text)
          Path('.github/workflows/temp-compact-courier-fee-card.yml').unlink()
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'Taxas do motoboy' src/routes/_authenticated/motoboys.tsx
          ! grep -q 'entregas.*×.*motoboyFee' src/routes/_authenticated/motoboys.tsx

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify courier fee summary card"
          git push origin HEAD:fix/courier-fee-card-compact
