name: Temp courier fee summary patch

on:
  push:
    branches:
      - feat/courier-fee-summary-card

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/courier-fee-summary-card
          fetch-depth: 0

      - name: Patch Motoboys fee summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_authenticated/motoboys.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const [historyLoading, setHistoryLoading] = useState(false);\n\n  const [inventoryRows, setInventoryRows] = useState<CourierInventoryItem[]>([]);',
              '  const [historyLoading, setHistoryLoading] = useState(false);\n  const [motoboyFee, setMotoboyFee] = useState(0);\n\n  const [inventoryRows, setInventoryRows] = useState<CourierInventoryItem[]>([]);',
              'motoboy fee state',
          )

          replace_once(
              '      setInventoryRows([]);\n      setLoading(false);',
              '      setInventoryRows([]);\n      setMotoboyFee(0);\n      setLoading(false);',
              'reset fee without active store',
          )

          replace_once(
              '      ]);\n    if (error) toast.error(error.message);',
              '''      ]);\n    const { data: feeSettings, error: feeError } = await (supabase as any)\n      .from("settings")\n      .select("motoboy_fee")\n      .eq("store_id", activeStoreId)\n      .maybeSingle();\n    if (feeError) console.error("Erro ao carregar taxa do motoboy", feeError);\n    setMotoboyFee(Number(feeSettings?.motoboy_fee || 0));\n    if (error) toast.error(error.message);''',
              'load configured motoboy fee',
          )

          replace_once(
              '''                const paymentTotals = sumPaymentBreakdowns(\n        (history?.deliveredOrders || []).map((delivery: any) => paymentRecordForDelivery(delivery)),\n      );\n                return (''',
              '''                const paymentTotals = sumPaymentBreakdowns(\n        (history?.deliveredOrders || []).map((delivery: any) => paymentRecordForDelivery(delivery)),\n      );\n                const deliveredCount = history?.deliveredOrders.length ?? 0;\n                const courierFeeDue = deliveredCount * motoboyFee;\n                return (''',
              'fee calculation per courier',
          )

          replace_once(
              '''            <div className="mt-4 grid grid-cols-2 gap-2 text-sm">\n                        <div className="rounded-xl border p-3">\n                          <div className="text-xs text-muted-foreground">Pedidos em posse</div>\n                          <div className="font-semibold text-primary">{brl(Number(loadItem.value_in_possession))}</div>\n                        </div>\n                        <div className="rounded-xl border p-3">\n                          <div className="text-xs text-muted-foreground">Entregue no período</div>\n                          <div className="font-semibold">{brl(history?.transportedValue ?? 0)}</div>\n                        </div>\n                      </div>''',
              '''            <div className="mt-4 grid grid-cols-3 gap-2 text-sm">\n                        <div className="rounded-xl border p-3">\n                          <div className="text-[11px] text-muted-foreground">Pedidos em posse</div>\n                          <div className="mt-1 font-semibold text-primary">{brl(Number(loadItem.value_in_possession))}</div>\n                        </div>\n                        <div className="rounded-xl border p-3">\n                          <div className="text-[11px] text-muted-foreground">Entregue no período</div>\n                          <div className="mt-1 font-semibold">{brl(history?.transportedValue ?? 0)}</div>\n                        </div>\n                        <div className="rounded-xl border border-primary/30 bg-primary/5 p-3">\n                          <div className="flex items-center gap-1 text-[11px] text-muted-foreground">\n                            <WalletCards className="h-3.5 w-3.5 text-primary" />\n                            Taxas do motoboy\n                          </div>\n                          <div className="mt-1 font-semibold text-primary">{brl(courierFeeDue)}</div>\n                          <div className="mt-1 text-[10px] leading-tight text-muted-foreground">\n                            {deliveredCount} {deliveredCount === 1 ? "entrega" : "entregas"} × {brl(motoboyFee)}\n                          </div>\n                        </div>\n                      </div>''',
              'three financial summary cards',
          )

          path.write_text(text)
          Path('.github/workflows/temp-courier-fee-card.yml').unlink()
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'Taxas do motoboy' src/routes/_authenticated/motoboys.tsx
          grep -q 'motoboy_fee' src/routes/_authenticated/motoboys.tsx

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show courier fees owed in motoboy cards"
          git push origin HEAD:feat/courier-fee-summary-card
