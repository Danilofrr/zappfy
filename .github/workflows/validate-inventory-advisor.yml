name: Validate Inventory Advisor

on:
  push:
    paths:
      - "src/lib/inventory-forecast.ts"
      - "src/hooks/use-inventory-advisor.ts"
      - "src/components/InventoryAdvisor.tsx"
      - "src/components/InventoryStockAlert.tsx"
      - "src/components/ComprasSection.tsx"
      - "src/routes/_authenticated/produtos.tsx"
      - "src/routes/_authenticated/index.tsx"
      - "tests/inventory-forecast.test.ts"
      - ".github/workflows/validate-inventory-advisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify planning math
        run: bun test tests/inventory-forecast.test.ts
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Verify app build
        run: bun run build
