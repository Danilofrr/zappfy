name: Validate Inventory Advisor

on:
  push:
    paths:
      - "src/lib/inventory-forecast.ts"
      - "src/hooks/use-inventory-advisor.ts"
      - "src/components/InventoryAdvisor.tsx"
      - "src/components/InventoryStockAlert.tsx"
      - "src/components/ComprasSection.tsx"
      - "src/routes/_authenticated/produtos.tsx"
      - "src/routes/_authenticated/index.tsx"
      - "tests/inventory-forecast.test.ts"
      - ".github/workflows/validate-inventory-advisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify planning math
        run: bun test tests/inventory-forecast.test.ts
      - name: Verify app build
        run: bun run build
      - name: Check changes for TypeScript errors
        shell: bash
        run: |
          set -euo pipefail
          # Legacy routes and delivery components already contain unrelated TS errors.
          # Report those separately without suppressing any errors in changed feature files.
          bunx tsc --noEmit > /tmp/inventory-tsc.txt 2>&1 || true
          if grep -E '^src/(components/(InventoryAdvisor|InventoryStockAlert|ComprasSection)|hooks/use-inventory-advisor|lib/inventory-forecast|routes/_authenticated/(produtos|index))\.(ts|tsx)\(' /tmp/inventory-tsc.txt; then
            echo "TypeScript error in inventory assistant feature" >&2
            exit 1
          fi
          if [[ -s /tmp/inventory-tsc.txt ]]; then
            echo "Existing project-wide TypeScript diagnostics (outside changed files):"
            tail -n 25 /tmp/inventory-tsc.txt
          fi
