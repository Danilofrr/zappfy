name: Temporary - fix delivery evidence

on:
  push:
    branches:
      - fix/comprovante-assinatura-entrega
    paths:
      - .github/workflows/temp-fix-delivery-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprovante-assinatura-entrega
          fetch-depth: 0

      - name: Patch courier delivery evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/entrega.$courierToken.tsx')
          text = path.read_text()

          replacements = [
            (
              '  const [finalizing, setFinalizing] = useState(false);\n  const [signatureOpen, setSignatureOpen] = useState(false);',
              '  const [finalizing, setFinalizing] = useState(false);\n  const [signatureOpen, setSignatureOpen] = useState(false);\n  const [evidenceSaving, setEvidenceSaving] = useState(false);'
            ),
            (
              '  const signatureCanvasRef = useRef<HTMLCanvasElement | null>(null);\n  const drawingRef = useRef(false);',
              '  const signatureCanvasRef = useRef<HTMLCanvasElement | null>(null);\n  const drawingRef = useRef(false);\n  const signatureHasInkRef = useRef(false);'
            ),
            (
              '''  async function handleProof(file?: File) {
    if (!file) return;
    try {
      const url = await imageFileToDataUrl(file);
      setProofUrl(url);
      toast.success("Comprovante anexado. Ele será salvo ao finalizar a entrega.");
    } catch (error: any) {
      toast.error(error?.message || "Não foi possível anexar o comprovante.");
    }
  }
''',
              '''  async function persistEvidence(options: {
    proofUrl?: string | null;
    signatureUrl?: string | null;
    clearProof?: boolean;
    clearSignature?: boolean;
  }) {
    setEvidenceSaving(true);
    try {
      const { error } = await (supabase as any).rpc("save_courier_delivery_evidence", {
        _token: courierToken,
        _proof_url: options.proofUrl ?? null,
        _signature_url: options.signatureUrl ?? null,
        _clear_proof: options.clearProof ?? false,
        _clear_signature: options.clearSignature ?? false,
      });
      if (error) throw error;
      return true;
    } catch (error: any) {
      toast.error(error?.message || "Não foi possível salvar a comprovação da entrega.");
      return false;
    } finally {
      setEvidenceSaving(false);
    }
  }

  async function handleProof(file?: File) {
    if (!file) return;
    try {
      const url = await imageFileToDataUrl(file);
      const saved = await persistEvidence({ proofUrl: url });
      if (!saved) return;
      setProofUrl(url);
      toast.success("Comprovante salvo na entrega.");
    } catch (error: any) {
      toast.error(error?.message || "Não foi possível anexar o comprovante.");
    }
  }

  async function removeEvidence(kind: "proof" | "signature") {
    const saved = await persistEvidence(
      kind === "proof" ? { clearProof: true } : { clearSignature: true },
    );
    if (!saved) return;
    if (kind === "proof") setProofUrl(null);
    else setSignatureUrl(null);
    toast.success(kind === "proof" ? "Comprovante removido." : "Assinatura removida.");
  }
'''
            ),
            (
              '''  function signaturePointerDown(event: React.PointerEvent<HTMLCanvasElement>) {
    drawingRef.current = true;''',
              '''  function signaturePointerDown(event: React.PointerEvent<HTMLCanvasElement>) {
    drawingRef.current = true;
    signatureHasInkRef.current = true;'''
            ),
            (
              '    drawingRef.current = false;\n  }\n\n  function saveSignature() {',
              '    drawingRef.current = false;\n    signatureHasInkRef.current = false;\n  }\n\n  async function saveSignature() {'
            ),
            (
              '''  async function saveSignature() {
    const canvas = signatureCanvasRef.current;
    if (!canvas) return;
    setSignatureUrl(canvas.toDataURL("image/png"));
    setSignatureOpen(false);
    toast.success("Assinatura registrada.");
  }
''',
              '''  async function saveSignature() {
    const canvas = signatureCanvasRef.current;
    if (!canvas) return;
    if (!signatureHasInkRef.current) {
      toast.error("Peça ao cliente para assinar antes de salvar.");
      return;
    }
    const url = canvas.toDataURL("image/png");
    const saved = await persistEvidence({ signatureUrl: url });
    if (!saved) return;
    setSignatureUrl(url);
    setSignatureOpen(false);
    toast.success("Assinatura salva na entrega.");
  }
'''
            ),
            (
              'onClick={() => setProofUrl(null)}><Trash2 className="h-4 w-4 mr-2" /> Remover comprovante</Button>',
              'disabled={evidenceSaving} onClick={() => removeEvidence("proof")}><Trash2 className="h-4 w-4 mr-2" /> Remover comprovante</Button>'
            ),
            (
              '<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => handleProof(e.target.files?.[0])} />',
              '<input type="file" accept="image/*" capture="environment" className="hidden" disabled={evidenceSaving} onChange={e => handleProof(e.target.files?.[0])} />'
            ),
            (
              'onClick={() => setSignatureUrl(null)}><Trash2 className="h-4 w-4 mr-2" /> Remover</Button>',
              'disabled={evidenceSaving} onClick={() => removeEvidence("signature")}><Trash2 className="h-4 w-4 mr-2" /> Remover</Button>'
            ),
            (
              '<Button disabled={finalizing} onClick={finalizeDelivery}',
              '<Button disabled={finalizing || evidenceSaving} onClick={finalizeDelivery}'
            ),
            (
              '<Button onClick={saveSignature}>Salvar</Button>',
              '<Button disabled={evidenceSaving} onClick={saveSignature}>{evidenceSaving ? <Loader2 className="h-4 w-4 animate-spin" /> : "Salvar"}</Button>'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected snippet not found:\n{old[:160]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate source
        run: |
          grep -q 'save_courier_delivery_evidence' 'src/routes/entrega.$courierToken.tsx'
          grep -q 'Comprovante salvo na entrega' 'src/routes/entrega.$courierToken.tsx'
          grep -q 'Assinatura salva na entrega' 'src/routes/entrega.$courierToken.tsx'

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-fix-delivery-evidence.yml
          git config user.name "Danilofrr"
          git config user.email "daniloferreiraa80@gmail.com"
          git add 'src/routes/entrega.$courierToken.tsx' .github/workflows/temp-fix-delivery-evidence.yml
          git commit -m "fix: salvar comprovante e assinatura imediatamente"
          git push origin HEAD:fix/comprovante-assinatura-entrega
