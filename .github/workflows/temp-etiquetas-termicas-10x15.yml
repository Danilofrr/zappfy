name: Temp etiquetas termicas 10x15

on:
  push:
    branches:
      - feat/etiquetas-termicas-10x15

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/etiquetas-termicas-10x15
          fetch-depth: 0

      - name: Patch Pedidos and Central
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str):
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              return text.replace(old, new, 1)

          pedidos = Path('src/routes/_authenticated/pedidos.tsx')
          text = pedidos.read_text()

          text = replace_once(
              text,
              'import { useActiveStore } from "@/lib/active-store";\nimport { supabase } from "@/integrations/supabase/client";',
              'import { useActiveStore } from "@/lib/active-store";\nimport { openShippingLabels } from "@/lib/shipping-labels";\nimport { supabase } from "@/integrations/supabase/client";',
              'pedidos shipping-label import',
          )

          helper = r'''
  function printLabels10x15(orders: Order[]) {
    if (!orders.length) {
      toast.error("Selecione ao menos um pedido para imprimir");
      return;
    }

    const opened = openShippingLabels({
      storeName: state.settings.storeName || "Loja",
      logoUrl: state.settings.checkoutLogoUrl || null,
      orders: orders.map((order) => {
        const assignment = assignmentByOrder.get(order.id);
        return {
          id: order.id,
          customer: order.customer,
          phone: order.phone,
          address: order.address,
          district: order.district,
          city: order.city,
          total: Number(order.total || 0),
          date: order.date,
          notes: order.notes,
          paymentLabel: formatPaymentBreakdown(order),
          items: (order.items || []).map((item) => ({ name: item.name, qty: Number(item.qty || 0) })),
          courierName: assignment?.courier_name || null,
          scheduledFor: assignment?.scheduled_for || null,
        };
      }),
    });

    if (!opened) toast.error("Permita pop-ups para gerar as etiquetas 10x15");
  }

'''
          text = replace_once(
              text,
              '  function handleStatusChange(o: Order, status: OrderStatus) {',
              helper + '  function handleStatusChange(o: Order, status: OrderStatus) {',
              'pedidos labels helper',
          )

          text = replace_once(
              text,
              'onClick={() => printLabel(o)}\n              title="Gerar etiqueta de envio"',
              'onClick={() => printLabels10x15([o])}\n              title="Gerar etiqueta térmica 10x15"',
              'single label action',
          )

          bulk_anchor = '''        )}
      </div>

      {(() => {'''
          bulk_new = '''        )}
        {selected.size > 0 && (
          <Button
            variant="outline"
            onClick={() => printLabels10x15(state.orders.filter((order) => selected.has(order.id)))}
          >
            <Tag className="mr-2 h-4 w-4" />
            Imprimir etiquetas 10x15 ({selected.size})
          </Button>
        )}
      </div>

      {(() => {'''
          text = replace_once(text, bulk_anchor, bulk_new, 'bulk label button')
          pedidos.write_text(text)

          central = Path('src/routes/entregas-zappfy.$storeSlug.index.tsx')
          text = central.read_text()

          text = replace_once(
              text,
              '  Power,\n  RefreshCw,',
              '  Power,\n  Printer,\n  RefreshCw,',
              'central printer icon',
          )
          text = replace_once(
              text,
              'import { CourierDeliveryMap } from "@/components/CourierDeliveryMap";',
              'import { CourierDeliveryMap } from "@/components/CourierDeliveryMap";\nimport { openShippingLabels } from "@/lib/shipping-labels";',
              'central shipping-label import',
          )
          text = replace_once(
              text,
              '  store_name: string;\n  slug: string;',
              '  store_name: string;\n  store_logo_url: string | null;\n  slug: string;',
              'central store logo type',
          )

          print_helper = r'''
  function printMyDeliveryLabels() {
    if (!me) return;
    const pending = available.filter((delivery) => isMapPendingDelivery(delivery.status));
    if (!pending.length) {
      toast.error("Você não possui pedidos pendentes para imprimir");
      return;
    }

    const opened = openShippingLabels({
      storeName: me.store_name || "Loja",
      logoUrl: me.store_logo_url || null,
      orders: pending.map((delivery) => {
        const parts = normalizePaymentBreakdown(delivery.order);
        const paymentLabel = parts.length
          ? parts.map((part) => `${paymentMethodLabel(part.method)} ${brl(part.amount)}`).join(" + ")
          : paymentMethodLabel(delivery.order.payment);
        return {
          id: delivery.order.id,
          customer: delivery.order.customer,
          phone: delivery.order.phone,
          address: delivery.order.address,
          district: delivery.order.district,
          city: delivery.order.city,
          total: Number(delivery.order.total || 0),
          notes: delivery.order.notes || delivery.notes,
          paymentLabel,
          items: (delivery.order.items || []).map((item) => ({
            name: item.name,
            qty: Number(item.qty || 0),
          })),
          courierName: me.name,
          scheduledFor: delivery.scheduled_for,
        };
      }),
    });

    if (!opened) toast.error("Permita pop-ups para gerar as etiquetas 10x15");
  }

'''
          text = replace_once(
              text,
              '  const cardStyle: React.CSSProperties = {',
              print_helper + '  const cardStyle: React.CSSProperties = {',
              'central label helper',
          )

          tabs_anchor = '''        <section
          className="grid grid-cols-2 gap-2 rounded-xl border p-1"'''
          print_section = '''        <section className="space-y-2 p-3" style={cardStyle}>
          <Button
            type="button"
            className="h-12 w-full text-sm font-semibold"
            disabled={mapCount === 0}
            onClick={printMyDeliveryLabels}
            style={{ background: theme.button_color, color: theme.button_text_color }}
          >
            <Printer className="mr-2 h-4 w-4" />
            Imprimir etiquetas 10x15 ({mapCount})
          </Button>
          <div className="text-center text-[11px] opacity-65">
            Gera todas as etiquetas dos pedidos pendentes em um único documento, 1 etiqueta por página.
          </div>
        </section>

        <section
          className="grid grid-cols-2 gap-2 rounded-xl border p-1"'''
          text = replace_once(text, tabs_anchor, print_section, 'central print labels section')
          central.write_text(text)
          PY

      - name: Remove temporary workflow before validation
        run: rm .github/workflows/temp-etiquetas-termicas-10x15.yml

      - name: Validate implementation
        run: |
          npm ci
          npm run build
          git diff --check
          grep -q 'Imprimir etiquetas 10x15' src/routes/_authenticated/pedidos.tsx
          grep -q 'Imprimir etiquetas 10x15' 'src/routes/entregas-zappfy.$storeSlug.index.tsx'
          grep -q '@page { size: 100mm 150mm' src/lib/shipping-labels.ts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adicionar etiquetas térmicas 10x15 em lote"
          git push origin HEAD:feat/etiquetas-termicas-10x15
