name: Temp etiquetas termicas 10x15

on:
  push:
    branches:
      - feat/etiquetas-termicas-10x15

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/etiquetas-termicas-10x15
          fetch-depth: 0

      - name: Apply label patch
        run: python3 scripts/patch-etiquetas-termicas.py

      - name: Validate implementation
        run: |
          npm ci
          npm run build
          git diff --check
          grep -q 'Imprimir etiquetas 10x15' src/routes/_authenticated/pedidos.tsx
          grep -q 'Imprimir etiquetas 10x15' 'src/routes/entregas-zappfy.$storeSlug.index.tsx'
          grep -q '@page { size: 100mm 150mm' src/lib/shipping-labels.ts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adicionar etiquetas térmicas 10x15 em lote"
          git push origin HEAD:feat/etiquetas-termicas-10x15
