name: Temp courier online UI patch

on:
  push:
    branches:
      - feat/motoboy-online-adiantar-entrega
    paths:
      - ".github/workflows/temp-courier-online-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motoboy-online-adiantar-entrega
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Patch courier status and early-delivery UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Central do motoboy
          p = Path('src/routes/entregas-zappfy.$storeSlug.index.tsx')
          s = p.read_text()
          s = replace_once(s, '  Phone,\n  RefreshCw,', '  Phone,\n  Power,\n  RefreshCw,', 'central power import')
          s = replace_once(
              s,
              '  phone: string;\n  store_id: string;',
              '  phone: string;\n  is_online: boolean;\n  online_updated_at?: string | null;\n  store_id: string;',
              'central me online fields',
          )
          s = replace_once(
              s,
              '  const [loading, setLoading] = useState(true);\n  const [busyTrackingCode, setBusyTrackingCode] = useState<string | null>(null);',
              '  const [loading, setLoading] = useState(true);\n  const [busyTrackingCode, setBusyTrackingCode] = useState<string | null>(null);\n  const [statusBusy, setStatusBusy] = useState(false);',
              'central status busy state',
          )

          toggle_anchor = '''  async function loadDeliveries() {
            const session = getCourierSession(storeSlug);'''
          toggle_new = '''  async function toggleOnlineStatus() {
            const session = getCourierSession(storeSlug);
            if (!session || !me) return;

            const nextOnline = !me.is_online;
            setStatusBusy(true);
            const { error } = await (supabase as any).rpc("courier_set_online", {
              _session: session,
              _online: nextOnline,
            });
            setStatusBusy(false);

            if (error) {
              toast.error(error.message);
              return;
            }

            setMe((current) =>
              current
                ? { ...current, is_online: nextOnline, online_updated_at: new Date().toISOString() }
                : current,
            );
            toast.success(nextOnline ? "Você está ativo para entregas" : "Você está offline");
          }

          async function loadDeliveries() {
            const session = getCourierSession(storeSlug);'''
          s = replace_once(s, toggle_anchor, toggle_new, 'central toggle function')

          s = replace_once(
              s,
              '''    if (actionName === "accept" || actionName === "start") {
              navigate({ to: "/entrega/$courierToken", params: { courierToken: d.courier_token } });''',
              '''    if (actionName === "accept" || actionName === "start") {
              setMe((current) => (current ? { ...current, is_online: true } : current));
              navigate({ to: "/entrega/$courierToken", params: { courierToken: d.courier_token } });''',
              'central action marks online',
          )

          store_section = '''        <section className="flex items-center gap-2 text-sm">
            <Store className="h-4 w-4" style={{ color: theme.icon_color }} />
            <span className="opacity-70">Loja:</span>
            <strong style={{ color: theme.title_color }}>{me.store_name}</strong>
          </section>'''
          store_with_status = '''        <section className="flex items-center gap-2 text-sm">
            <Store className="h-4 w-4" style={{ color: theme.icon_color }} />
            <span className="opacity-70">Loja:</span>
            <strong style={{ color: theme.title_color }}>{me.store_name}</strong>
          </section>

          <section className="flex items-center justify-between gap-3 p-3" style={cardStyle}>
            <div className="flex items-center gap-3 min-w-0">
              <div
                className="grid h-9 w-9 shrink-0 place-items-center rounded-full"
                style={{
                  background: me.is_online ? `${theme.button_color}22` : `${theme.card_border_color}66`,
                  color: me.is_online ? theme.button_color : theme.text_color,
                }}
              >
                <Power className="h-4 w-4" />
              </div>
              <div className="min-w-0">
                <div className="text-xs opacity-65">Seu status de trabalho</div>
                <div className="font-semibold" style={{ color: me.is_online ? theme.button_color : theme.title_color }}>
                  {me.is_online ? "Ativo agora" : "Offline"}
                </div>
              </div>
            </div>
            <Button
              type="button"
              variant={me.is_online ? "outline" : "default"}
              disabled={statusBusy}
              onClick={toggleOnlineStatus}
              style={
                me.is_online
                  ? { borderColor: `${theme.button_color}88`, color: theme.button_color }
                  : { background: theme.button_color, color: theme.button_text_color }
              }
            >
              {statusBusy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <Power className="mr-1 h-4 w-4" />}
              {me.is_online ? "Ficar offline" : "Ficar ativo"}
            </Button>
          </section>'''
          s = replace_once(s, store_section, store_with_status, 'central work status section')

          s = replace_once(
              s,
              '''                const awaitingDecision =
                  !isScheduledForFuture &&
                  !d.accepted_at &&
                  ["aguardando_motoboy", "preparando"].includes(d.status);''',
              '''                const awaitingDecision =
                  !d.accepted_at && ["aguardando_motoboy", "preparando"].includes(d.status);''',
              'future deliveries can be accepted',
          )

          s = replace_once(
              s,
              '''                        {isScheduledForFuture && (
                            <div className="mt-1 opacity-70">
                              O botão Aceitar será liberado no dia programado.
                            </div>
                          )}''',
              '''                        {isScheduledForFuture && (
                            <div className="mt-1 opacity-70">
                              Data planejada. Você pode aceitar agora e adiantar a entrega, se quiser.
                            </div>
                          )}''',
              'future delivery helper text',
          )

          s = replace_once(
              s,
              'awaitingDecision || isScheduledForFuture ? "col-span-2" : ""',
              'awaitingDecision ? "col-span-2" : ""',
              'central phone span',
          )

          future_block = '''                      {isScheduledForFuture &&
                          !d.accepted_at &&
                          ["aguardando_motoboy", "preparando"].includes(d.status) && (
                            <>
                              <Button
                                disabled={busy}
                                variant="destructive"
                                onClick={() => action(d, "reject")}
                                className="h-11"
                              >
                                <XCircle className="mr-1 h-4 w-4" />
                                Recusar
                              </Button>
                              <Button disabled variant="outline" className="h-11">
                                <CalendarDays className="mr-1 h-4 w-4" />
                                {formatCentralScheduledDate(d.scheduled_for)}
                              </Button>
                            </>
                          )}

'''
          s = replace_once(s, future_block, '', 'remove future disabled actions')
          p.write_text(s)

          # Tipos compartilhados
          p = Path('src/lib/delivery-load.ts')
          s = p.read_text()
          s = replace_once(
              s,
              '  active: boolean;\n  orders_in_possession: number;',
              '  active: boolean;\n  is_online: boolean;\n  online_updated_at: string | null;\n  in_route: boolean;\n  orders_in_possession: number;',
              'courier load presence fields',
          )
          p.write_text(s)

          # Painel administrativo de motoboys
          p = Path('src/routes/_authenticated/motoboys.tsx')
          s = p.read_text()
          s = replace_once(
              s,
              '  active: boolean;\n  last_login_at: string | null;',
              '  active: boolean;\n  is_online: boolean;\n  online_updated_at: string | null;\n  last_login_at: string | null;',
              'courier presence fields',
          )

          history_anchor = '''  async function loadHistory(couriers = list, showLoading = true) {'''
          polling = '''  useEffect(() => {
            if (!activeStoreId) return;
            const interval = window.setInterval(() => {
              void load(false);
            }, 15000);
            return () => window.clearInterval(interval);
            // Mantém online/offline e "em rota" atualizados sem exigir refresh manual.
            // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [activeStoreId]);

          async function loadHistory(couriers = list, showLoading = true) {'''
          s = replace_once(s, history_anchor, polling, 'motoboys live status polling')

          old_status = '''                          <div className="text-xs text-muted-foreground">{courier?.active === false ? "Acesso inativo" : "Motoboy ativo"}</div>'''
          new_status = '''                          <div className="mt-1 flex items-center gap-2 text-xs">
                            {courier?.active === false ? (
                              <span className="inline-flex items-center gap-1 rounded-full border border-destructive/30 bg-destructive/10 px-2 py-0.5 text-destructive">
                                <span className="h-1.5 w-1.5 rounded-full bg-current" /> Acesso inativo
                              </span>
                            ) : loadItem.in_route ? (
                              <span className="inline-flex items-center gap-1 rounded-full border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 text-amber-500">
                                <RouteIcon className="h-3 w-3" /> Em rota agora
                              </span>
                            ) : loadItem.is_online ? (
                              <span className="inline-flex items-center gap-1 rounded-full border border-primary/30 bg-primary/10 px-2 py-0.5 text-primary">
                                <span className="h-1.5 w-1.5 rounded-full bg-current" /> Ativo agora
                              </span>
                            ) : (
                              <span className="inline-flex items-center gap-1 rounded-full border border-border bg-secondary/50 px-2 py-0.5 text-muted-foreground">
                                <span className="h-1.5 w-1.5 rounded-full bg-current" /> Offline
                              </span>
                            )}
                          </div>'''
          s = replace_once(s, old_status, new_status, 'motoboy card presence status')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed frontend files
        run: bunx prettier --write "src/routes/entregas-zappfy.$storeSlug.index.tsx" src/lib/delivery-load.ts src/routes/_authenticated/motoboys.tsx

      - name: Build
        run: bun run build

      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/entregas-zappfy.$storeSlug.index.tsx src/lib/delivery-load.ts src/routes/_authenticated/motoboys.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: show courier live status and allow early delivery"
          git push origin HEAD:feat/motoboy-online-adiantar-entrega
