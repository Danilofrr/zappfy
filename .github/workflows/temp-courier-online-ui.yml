name: Temp courier online UI patch

on:
  push:
    branches:
      - feat/motoboy-online-adiantar-entrega
    paths:
      - ".github/workflows/temp-courier-online-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motoboy-online-adiantar-entrega
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Patch files
        run: python3 scripts/temp_patch_courier_online.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed frontend files
        shell: bash
        run: |
          bunx prettier --write 'src/routes/entregas-zappfy.$storeSlug.index.tsx' src/lib/delivery-load.ts src/routes/_authenticated/motoboys.tsx

      - name: Build
        run: bun run build

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/entregas-zappfy.$storeSlug.index.tsx' src/lib/delivery-load.ts src/routes/_authenticated/motoboys.tsx
          if git diff --cached --quiet; then
            echo "No frontend changes"
            exit 0
          fi
          git commit -m "feat: show courier live status and allow early delivery"
          git push origin HEAD:feat/motoboy-online-adiantar-entrega
