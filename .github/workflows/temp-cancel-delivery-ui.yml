name: Temporary cancel delivery UI patch

on:
  push:
    branches:
      - feat/cancelar-entrega-pos-inicio
    paths:
      - tools/run-cancel-delivery-ui.marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cancelar-entrega-pos-inicio
          fetch-depth: 0

      - name: Patch delivery page
        run: python3 tools/patch_cancel_delivery_ui.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          grep -q 'cancel_courier_delivery' 'src/routes/entrega.$courierToken.tsx'
          grep -q 'Cancelar Entrega' 'src/routes/entrega.$courierToken.tsx'
          grep -q 'DELIVERY_FAILURE_REASONS' 'src/routes/entrega.$courierToken.tsx'
          grep -q 'Entrega não realizada' 'src/routes/entrega.$courierToken.tsx'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Commit delivery UI
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/entrega.$courierToken.tsx'
          git diff --cached --check
          git commit -m "feat: mover pagamento e permitir cancelar entrega"
          git push origin HEAD:feat/cancelar-entrega-pos-inicio
