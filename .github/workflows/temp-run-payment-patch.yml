name: Run detailed payment patch

on:
  push:
    branches:
      - feat/pagamentos-detalhados-motoboys

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/pagamentos-detalhados-motoboys
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/temp_patch_payments.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q "Valores recebidos nas entregas" src/routes/_authenticated/motoboys.tsx
          grep -q "Pagamento do cliente" 'src/routes/entregas-zappfy.$storeSlug.index.tsx'
          grep -q "Forma de pagamento" 'src/routes/entrega.$courierToken.tsx'
          grep -q "attachPaymentBreakdownToItems" src/routes/_authenticated/pedidos.tsx

      - name: Build
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/pedidos.tsx src/routes/_authenticated/motoboys.tsx 'src/routes/entregas-zappfy.$storeSlug.index.tsx' 'src/routes/entrega.$courierToken.tsx'
          git commit -m "feat: detalhar pagamentos nas entregas dos motoboys"
          git push origin HEAD:feat/pagamentos-detalhados-motoboys
