name: Temporary finalize delivery mobile fix

on:
  push:
    branches:
      - fix/finalizar-entrega-mobile
    paths:
      - tools/run-finalize-delivery-fix.marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalizar-entrega-mobile
          fetch-depth: 0

      - name: Restore existing order label helper
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/routes/entrega.$courierToken.tsx"); t=p.read_text(); old="#{String(data.order.id || \"\").slice(0, 8)}"; new="#{orderShortNumber(data.order.id)}"; assert old in t; p.write_text(t.replace(old,new,1))'
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/entrega.$courierToken.tsx'
          git diff --cached --check
          git commit -m "chore: restore delivery order number helper"
          git push origin HEAD:fix/finalizar-entrega-mobile
