name: Temporary motoboys realtime payments fix

on:
  push:
    branches:
      - fix/motoboys-realtime-pagamentos
    paths:
      - tools/run-motoboys-fix.marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motoboys-realtime-pagamentos
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch motoboys page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_authenticated/motoboys.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''const statusLabel = (status: string) => {
            const labels: Record<string, string> = {
              aguardando_motoboy: "Aguardando motoboy",
              saiu_para_entrega: "Em rota",
              entregue: "Entregue",
              nao_entregue: "Não entregue",
              retornando: "Retornando",
              devolvido: "Devolvido à loja",
              cancelado: "Cancelado",
            };
            return labels[status] || status.replaceAll("_", " ");
          };
          ''',
          '''const statusLabel = (status: string) => {
            const labels: Record<string, string> = {
              aguardando_motoboy: "Aguardando motoboy",
              saiu_para_entrega: "Em rota",
              entregue: "Entregue",
              nao_entregue: "Não entregue",
              retornando: "Retornando",
              devolvido: "Devolvido à loja",
              cancelado: "Cancelado",
            };
            return labels[status] || status.replaceAll("_", " ");
          };

          const paymentRecordForDelivery = (delivery: any) => {
            const received = Array.isArray(delivery?.received_payments) ? delivery.received_payments : [];
            if (received.length > 0) {
              return {
                items: [{ _paymentBreakdown: received }],
                total: Number(delivery?.received_payment_total ?? delivery?.order?.total ?? 0),
              };
            }
            return delivery?.order || {};
          };
          ''',
          'add payment helper')

          replace_once('''  async function load() {
          ''', '''  async function load(showLoading = true) {
          ''', 'load signature')

          replace_once('''    setLoading(true);
            const [{ data, error }, { data: loadData, error: loadError }, { data: inventoryData, error: inventoryError }] =
          ''', '''    if (showLoading) setLoading(true);
            const [{ data, error }, { data: loadData, error: loadError }, { data: inventoryData, error: inventoryError }] =
          ''', 'load spinner start')

          replace_once('''    setInventoryRows(Array.isArray(inventoryData) ? inventoryData : []);
            setLoading(false);
            }

            async function loadHistory(couriers = list) {
          ''', '''    setInventoryRows(Array.isArray(inventoryData) ? inventoryData : []);
            if (showLoading) setLoading(false);
            }

            async function loadHistory(couriers = list, showLoading = true) {
          ''', 'load spinner end and history signature')

          replace_once('''    setHistoryLoading(true);
            try {
              const results = await Promise.all(
          ''', '''    if (showLoading) setHistoryLoading(true);
            try {
              const { data: receivedRows, error: receivedError } = await (supabase as any)
                .from("delivery_tracking")
                .select("order_id,courier_id,received_payments,received_payment_total,completed_at")
                .eq("store_id", activeStoreId)
                .not("completed_at", "is", null)
                .gte("completed_at", range.start.toISOString())
                .lte("completed_at", range.end.toISOString());

              if (receivedError) console.error("Erro ao carregar pagamentos recebidos dos motoboys", receivedError);

              const receivedByOrder = new Map<string, any>(
                (Array.isArray(receivedRows) ? receivedRows : []).map((row: any) => [String(row.order_id || ""), row]),
              );

              const results = await Promise.all(
          ''', 'actual payment query')

          replace_once('''          const deliveredOrders = orders.filter(
                    (delivery: any) =>
                      delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
                  );
          ''', '''          const deliveredOrders = orders
                    .filter(
                      (delivery: any) =>
                        delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
                    )
                    .map((delivery: any) => {
                      const orderId = String(delivery?.order?.id || delivery?.order_id || "");
                      const received = receivedByOrder.get(orderId);
                      return received
                        ? {
                            ...delivery,
                            received_payments: received.received_payments,
                            received_payment_total: received.received_payment_total,
                          }
                        : delivery;
                    });
          ''', 'enrich delivered orders')

          replace_once('''    } finally {
              setHistoryLoading(false);
            }
            }

            async function loadInventoryMovements''', '''    } finally {
              if (showLoading) setHistoryLoading(false);
            }
            }

            async function loadInventoryMovements''', 'history spinner end')

          old_realtime = '''  useEffect(() => {
            if (!activeStoreId) return;
            const channel = supabase
              .channel(`motoboy_loads_${activeStoreId}`)
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "delivery_tracking", filter: `store_id=eq.${activeStoreId}` },
                () => load(),
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "delivery_events", filter: `store_id=eq.${activeStoreId}` },
                () => {
                  if (activeTab === "load") loadHistory();
                },
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "courier_inventory", filter: `store_id=eq.${activeStoreId}` },
                () => loadInventory(),
              )
              .subscribe();
            return () => {
              supabase.removeChannel(channel);
            };
          }, [activeStoreId, activeTab, list, period, customFrom, customTo]);
          '''
          new_realtime = '''  useEffect(() => {
            if (!activeStoreId) return;

            let refreshTimer: ReturnType<typeof setTimeout> | null = null;
            const scheduleOperationalRefresh = (includeHistory: boolean) => {
              if (refreshTimer) clearTimeout(refreshTimer);
              refreshTimer = setTimeout(() => {
                void load(false);
                if (includeHistory && activeTab === "load" && list.length > 0) {
                  void loadHistory(list, false);
                }
              }, 500);
            };

            const channel = supabase
              .channel(`motoboy_loads_${activeStoreId}`)
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "delivery_events", filter: `store_id=eq.${activeStoreId}` },
                () => scheduleOperationalRefresh(true),
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "courier_inventory", filter: `store_id=eq.${activeStoreId}` },
                () => {
                  void loadInventory();
                },
              )
              .subscribe();

            return () => {
              if (refreshTimer) clearTimeout(refreshTimer);
              supabase.removeChannel(channel);
            };
          }, [activeStoreId, activeTab, list, period, customFrom, customTo]);
          '''
          replace_once(old_realtime, new_realtime, 'stabilize realtime')

          replace_once('''                const paymentTotals = sumPaymentBreakdowns(
                          (history?.deliveredOrders || []).map((delivery: any) => delivery.order || {}),
                        );
          ''', '''                const paymentTotals = sumPaymentBreakdowns(
                          (history?.deliveredOrders || []).map((delivery: any) => paymentRecordForDelivery(delivery)),
                        );
          ''', 'payment totals')

          replace_once('''<div className="mt-0.5 text-[10px] font-medium text-primary">{formatPaymentBreakdown(delivery.order)}</div>''', '''<div className="mt-0.5 text-[10px] font-medium text-primary">{formatPaymentBreakdown(paymentRecordForDelivery(delivery))}</div>''', 'client payment display')

          replace_once('''  const modalDeliveredOrders = (detail?.orders || []).filter(
              (delivery: any) => delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
            );
          ''', '''  const modalDeliveredOrders = (detail?.orders || [])
              .filter(
                (delivery: any) => delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
              )
              .map((delivery: any) => {
                const orderId = String(delivery?.order?.id || delivery?.order_id || "");
                return (
                  detailHistory?.deliveredOrders.find(
                    (historyDelivery: any) =>
                      String(historyDelivery?.order?.id || historyDelivery?.order_id || "") === orderId,
                  ) || delivery
                );
              });
          ''', 'modal payment enrichment')

          old_modal = '''<div className="mt-1 font-medium text-primary">Pagamento: {formatPaymentBreakdown(delivery.order)}</div></div><div className="text-xs text-muted-foreground sm:text-right"><div className="font-medium text-primary">Entregue</div>'''
          new_modal = '''<div className="mt-1 font-medium text-primary">Pagamento: {formatPaymentBreakdown(paymentRecordForDelivery(delivery))}</div></div><div className="text-xs text-muted-foreground sm:text-right"><div className="font-medium text-primary">Entregue</div>'''
          replace_once(old_modal, new_modal, 'modal received payment display')

          path.write_text(text)
          PY

      - name: Format and validate
        run: |
          npx prettier --write src/routes/_authenticated/motoboys.tsx
          npx prettier --check src/routes/_authenticated/motoboys.tsx
          npx tsc --noEmit --pretty false

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/motoboys.tsx
          git diff --cached --check
          git commit -m "fix: stabilize motoboys realtime and received payments"
          git push origin HEAD:fix/motoboys-realtime-pagamentos
