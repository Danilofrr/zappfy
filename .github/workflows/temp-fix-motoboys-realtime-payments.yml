name: Temporary motoboys realtime payments fix

on:
  push:
    branches:
      - fix/motoboys-realtime-pagamentos
    paths:
      - tools/run-motoboys-fix.marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motoboys-realtime-pagamentos
          fetch-depth: 0

      - name: Patch motoboys page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/_authenticated/motoboys.tsx')
          text = path.read_text()

          def literal(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          def regex(pattern, repl, label, flags=0):
              global text
              text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')

          literal(
          '''const statusLabel = (status: string) => {
            const labels: Record<string, string> = {
              aguardando_motoboy: "Aguardando motoboy",
              saiu_para_entrega: "Em rota",
              entregue: "Entregue",
              nao_entregue: "Não entregue",
              retornando: "Retornando",
              devolvido: "Devolvido à loja",
              cancelado: "Cancelado",
            };
            return labels[status] || status.replaceAll("_", " ");
          };
          ''',
          '''const statusLabel = (status: string) => {
            const labels: Record<string, string> = {
              aguardando_motoboy: "Aguardando motoboy",
              saiu_para_entrega: "Em rota",
              entregue: "Entregue",
              nao_entregue: "Não entregue",
              retornando: "Retornando",
              devolvido: "Devolvido à loja",
              cancelado: "Cancelado",
            };
            return labels[status] || status.replaceAll("_", " ");
          };

          const paymentRecordForDelivery = (delivery: any) => {
            const received = Array.isArray(delivery?.received_payments) ? delivery.received_payments : [];
            if (received.length > 0) {
              return {
                items: [{ _paymentBreakdown: received }],
                total: Number(delivery?.received_payment_total ?? delivery?.order?.total ?? 0),
              };
            }
            return delivery?.order || {};
          };
          ''', 'payment helper')

          literal('async function load() {', 'async function load(showLoading = true) {', 'load signature')
          literal('    setLoading(true);', '    if (showLoading) setLoading(true);', 'load spinner start')
          regex(
              r'(setInventoryRows\(Array\.isArray\(inventoryData\) \? inventoryData : \[\]\);\n\s*)setLoading\(false\);',
              r'\1if (showLoading) setLoading(false);',
              'load spinner end',
          )
          literal('async function loadHistory(couriers = list) {', 'async function loadHistory(couriers = list, showLoading = true) {', 'history signature')
          literal('    setHistoryLoading(true);', '    if (showLoading) setHistoryLoading(true);', 'history spinner start')
          regex(r'(\} finally \{\n\s*)setHistoryLoading\(false\);', r'\1if (showLoading) setHistoryLoading(false);', 'history spinner end')

          literal(
          '''    try {
              const results = await Promise.all(
          ''',
          '''    try {
              const { data: receivedRows, error: receivedError } = await (supabase as any)
                .from("delivery_tracking")
                .select("order_id,courier_id,received_payments,received_payment_total,completed_at")
                .eq("store_id", activeStoreId)
                .not("completed_at", "is", null)
                .gte("completed_at", range.start.toISOString())
                .lte("completed_at", range.end.toISOString());

              if (receivedError) console.error("Erro ao carregar pagamentos recebidos dos motoboys", receivedError);

              const receivedByOrder = new Map<string, any>(
                (Array.isArray(receivedRows) ? receivedRows : []).map((row: any) => [String(row.order_id || ""), row]),
              );

              const results = await Promise.all(
          ''', 'actual payment query')

          regex(
              r'''const deliveredOrders = orders\.filter\(\s*\(delivery: any\) =>\s*delivery\.status === "entregue" && isWithin\(delivery\.completed_at, range\.start, range\.end\),\s*\);''',
              '''const deliveredOrders = orders
                    .filter(
                      (delivery: any) =>
                        delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
                    )
                    .map((delivery: any) => {
                      const orderId = String(delivery?.order?.id || delivery?.order_id || "");
                      const received = receivedByOrder.get(orderId);
                      return received
                        ? {
                            ...delivery,
                            received_payments: received.received_payments,
                            received_payment_total: received.received_payment_total,
                          }
                        : delivery;
                    });''',
              'enrich delivered orders',
              re.S,
          )

          realtime_start = text.find('  useEffect(() => {\n    if (!activeStoreId) return;\n    const channel = supabase\n      .channel(`motoboy_loads_${activeStoreId}`)')
          if realtime_start < 0:
              raise SystemExit('realtime block start not found')
          realtime_end_marker = '  }, [activeStoreId, activeTab, list, period, customFrom, customTo]);'
          realtime_end = text.find(realtime_end_marker, realtime_start)
          if realtime_end < 0:
              raise SystemExit('realtime block end not found')
          realtime_end += len(realtime_end_marker)
          new_realtime = '''  useEffect(() => {
            if (!activeStoreId) return;

            let refreshTimer: ReturnType<typeof setTimeout> | null = null;
            const scheduleOperationalRefresh = (includeHistory: boolean) => {
              if (refreshTimer) clearTimeout(refreshTimer);
              refreshTimer = setTimeout(() => {
                void load(false);
                if (includeHistory && activeTab === "load" && list.length > 0) {
                  void loadHistory(list, false);
                }
              }, 500);
            };

            const channel = supabase
              .channel(`motoboy_loads_${activeStoreId}`)
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "delivery_events", filter: `store_id=eq.${activeStoreId}` },
                () => scheduleOperationalRefresh(true),
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "courier_inventory", filter: `store_id=eq.${activeStoreId}` },
                () => {
                  void loadInventory();
                },
              )
              .subscribe();

            return () => {
              if (refreshTimer) clearTimeout(refreshTimer);
              supabase.removeChannel(channel);
            };
          }, [activeStoreId, activeTab, list, period, customFrom, customTo]);'''
          text = text[:realtime_start] + new_realtime + text[realtime_end:]

          literal(
          '''                const paymentTotals = sumPaymentBreakdowns(
                          (history?.deliveredOrders || []).map((delivery: any) => delivery.order || {}),
                        );''',
          '''                const paymentTotals = sumPaymentBreakdowns(
                          (history?.deliveredOrders || []).map((delivery: any) => paymentRecordForDelivery(delivery)),
                        );''', 'payment totals')

          literal(
              '{formatPaymentBreakdown(delivery.order)}</div>\n                      </div>\n                      <div className="shrink-0 text-[10px] text-muted-foreground">',
              '{formatPaymentBreakdown(paymentRecordForDelivery(delivery))}</div>\n                      </div>\n                      <div className="shrink-0 text-[10px] text-muted-foreground">',
              'client received payment display',
          )

          regex(
              r'''const modalDeliveredOrders = \(detail\?\.orders \|\| \[\]\)\.filter\(\s*\(delivery: any\) => delivery\.status === "entregue" && isWithin\(delivery\.completed_at, range\.start, range\.end\),\s*\);''',
              '''const modalDeliveredOrders = (detail?.orders || [])
              .filter(
                (delivery: any) => delivery.status === "entregue" && isWithin(delivery.completed_at, range.start, range.end),
              )
              .map((delivery: any) => {
                const orderId = String(delivery?.order?.id || delivery?.order_id || "");
                return (
                  detailHistory?.deliveredOrders.find(
                    (historyDelivery: any) =>
                      String(historyDelivery?.order?.id || historyDelivery?.order_id || "") === orderId,
                  ) || delivery
                );
              });''',
              'modal payment enrichment',
              re.S,
          )

          old_modal = 'Pagamento: {formatPaymentBreakdown(delivery.order)}</div></div><div className="text-xs text-muted-foreground sm:text-right"><div className="font-medium text-primary">Entregue</div>'
          new_modal = 'Pagamento: {formatPaymentBreakdown(paymentRecordForDelivery(delivery))}</div></div><div className="text-xs text-muted-foreground sm:text-right"><div className="font-medium text-primary">Entregue</div>'
          literal(old_modal, new_modal, 'modal received payment display')

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'paymentRecordForDelivery' src/routes/_authenticated/motoboys.tsx
          grep -q 'received_payments,received_payment_total' src/routes/_authenticated/motoboys.tsx
          ! grep -q 'table: "delivery_tracking"' src/routes/_authenticated/motoboys.tsx

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/motoboys.tsx
          git diff --cached --check
          git commit -m "fix: stabilize motoboys realtime and received payments"
          git push origin HEAD:fix/motoboys-realtime-pagamentos
