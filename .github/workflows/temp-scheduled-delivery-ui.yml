name: Temp scheduled delivery UI patch

on:
  push:
    branches:
      - feat/agendar-entrega-motoboy
    paths:
      - ".github/workflows/temp-scheduled-delivery-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agendar-entrega-motoboy
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Patch files
        run: python3 scripts/patch-scheduled-delivery-ui.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bunx prettier --write src/routes/_authenticated/pedidos.tsx 'src/routes/entregas-zappfy.$storeSlug.index.tsx' src/lib/delivery-load.ts

      - name: Build
        run: bun run build

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/temp-scheduled-delivery-ui.yml scripts/patch-scheduled-delivery-ui.py
          git config user.name "Danilofrr"
          git config user.email "daniloferreiraa80@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: schedule courier deliveries by date"
          git push origin HEAD:feat/agendar-entrega-motoboy
